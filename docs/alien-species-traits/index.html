<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alien Species Traits Index</title>
  <style>
    :root {
      --bg:#0b1020; --panel:#121a30; --panel2:#0f1629; --text:#eaf0ff; --muted:#9fb1d6; --accent:#7aa2ff;
      --chip:#1d294a; --chipBorder:#304372;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: radial-gradient(1200px 800px at 20% -10%, #1a2a52 0%, var(--bg) 50%), var(--bg); color:var(--text); }
    .wrap { max-width:1200px; margin:0 auto; padding:20px; }
    h1 { margin:0 0 8px; font-size: clamp(1.3rem, 2vw, 2rem); }
    .sub { color:var(--muted); margin-bottom:12px; }
    .top-actions { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 14px; }
    .top-doc-btn { border:1px solid #2a3b66; background:var(--panel); color:var(--text); border-radius:999px; padding:8px 14px; cursor:pointer; font-weight:600; }
    .top-doc-btn:hover { border-color:var(--accent); }
    .top-doc-btn.orange { background:#ff9f1a; border-color:#ff9f1a; color:#1f1400; }
    .top-doc-btn .btn-icon { width:18px; height:18px; object-fit:cover; border-radius:4px; vertical-align:middle; margin-right:6px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    input[type="search"] { flex:1; min-width:220px; background:var(--panel); border:1px solid #2a3b66; color:var(--text); border-radius:12px; padding:10px 12px; }
    select, button { background:var(--panel); border:1px solid #2a3b66; color:var(--text); border-radius:10px; padding:8px 10px; }
    .stats { color:var(--muted); font-size:.95rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
    .card { background:linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid #2a3b66; border-radius:16px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.25); }
    .thumb { aspect-ratio: 2 / 3; width:100%; object-fit:cover; background:#0d152a; display:block; }
    .card-body { padding:10px; }
    .name { font-weight:700; font-size:.97rem; margin:0 0 8px; word-break:break-word; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; }
    .chip { font-size:.78rem; border:1px solid var(--chipBorder); background:var(--chip); color:#d7e5ff; padding:4px 8px; border-radius:999px; text-decoration:none; cursor:pointer; }
    .chip:hover { border-color:var(--accent); color:white; }
    .pager { display:flex; align-items:center; justify-content:center; gap:10px; margin:18px 0 8px; flex-wrap:wrap; }
    .pagebtn { min-width:84px; }
    .pnum { color:var(--muted); }
    .empty { color:var(--muted); padding:24px 0; text-align:center; }

    /* Modal dossier */
    .modal[hidden] { display:none; }
    .modal { position:fixed; inset:0; z-index:50; }
    .modal-backdrop { position:absolute; inset:0; background:rgba(3,7,20,.72); backdrop-filter: blur(3px); }
    .modal-panel { position:relative; margin:3vh auto; width:min(980px, 94vw); max-height:94vh; overflow:auto; background:linear-gradient(180deg,#121a31,#0b1224); border:1px solid #2c3e6d; border-radius:16px; box-shadow:0 25px 70px rgba(0,0,0,.55); }
    .modal-head { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:rgba(11,18,36,.92); border-bottom:1px solid #2c3e6d; }
    .modal-title { margin:0; font-size:1.05rem; }
    .close-btn { border-radius:999px; width:34px; height:34px; line-height:18px; font-size:18px; cursor:pointer; }
    .modal-content { padding:16px; }
    .dossier { display:grid; grid-template-columns:minmax(220px, 32%) 1fr; gap:16px; }
    @media (max-width: 820px) { .dossier { grid-template-columns:1fr; } }
    .dossier-image { width:100%; border-radius:12px; border:1px solid #2d3f70; background:#0b1327; object-fit:cover; }
    .dossier-panel { border:1px solid #2d3f70; border-radius:12px; padding:12px 14px; background:rgba(20,29,53,.55); }
    .dossier-panel h2 { margin:0 0 8px; font-size:1.25rem; }
    .dossier-panel h3 { margin:14px 0 8px; color:#c2d4ff; font-size:.95rem; letter-spacing:.04em; text-transform:uppercase; }
    .dossier-panel p { margin:0 0 10px; line-height:1.55; color:#dde7ff; }
    .dossier-panel ul { margin:0 0 10px 18px; padding:0; }
    .dossier-panel li { margin:0 0 6px; line-height:1.45; }
    .dossier-meta { color:var(--muted); font-size:.88rem; }
    .dossier-loading, .dossier-error { color:var(--muted); padding:12px 4px; }
  </style>
</head>

let filtered = [...ITEMS];
let page = 1;
let lastFocused = null;

const DOC_IMAGES = {
  'README-bible.md': 'orange-bible.png',
  'README-Dossier.md': 'dossier.png', // optional future image
  'README-The-Way.md': 'jesus-in-suite.png',
};

const els = {
  q: document.getElementById('q'),
  pageSize: document.getElementById('pageSize'),
  stats: document.getElementById('stats'),
  grid: document.getElementById('grid'),
  prev: document.getElementById('prev'),
  next: document.getElementById('next'),
  pnum: document.getElementById('pnum'),
  mdModal: document.getElementById('mdModal'),
  modalBody: document.getElementById('modalBody'),
  modalTitle: document.getElementById('modalTitle'),
  modalClose: document.getElementById('modalClose'),
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function inlineMd(txt) {
  return esc(txt)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function mdToDossierHtml(mdRaw, item) {
  const lines = mdRaw.replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let inList = false;

  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }

    if (/^#\s+/.test(line)) { closeList(); html += `<h2>${inlineMd(line.replace(/^#\s+/, ''))}</h2>`; continue; }
    if (/^##\s+/.test(line)) { closeList(); html += `<h3>${inlineMd(line.replace(/^##\s+/, ''))}</h3>`; continue; }
    if (/^---$/.test(line)) { closeList(); continue; }

    if (/^-\s+/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inlineMd(line.replace(/^-\s+/, ''))}</li>`;
      continue;
    }

    closeList();
    html += `<p>${inlineMd(line)}</p>`;
  }
  closeList();

  const mappedDocImage = DOC_IMAGES[item.md];
  const portraitSrc = item.png || mappedDocImage;
  const portrait = portraitSrc
    ? `<img class="dossier-image" src="${portraitSrc}" alt="${esc(item.name)} portrait" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling && (this.nextElementSibling.style.display='grid');" /><div class="dossier-image" style="aspect-ratio:2/3;display:none;place-items:center;color:#9fb1d6;">No portrait</div>`
    : `<div class="dossier-image" style="aspect-ratio:2/3;display:grid;place-items:center;color:#9fb1d6;">No portrait</div>`;

  return `
    <article class="dossier">
      <div>${portrait}</div>
      <div class="dossier-panel">
        <div class="dossier-meta">Source: <code>${esc(item.md)}</code></div>
        ${html}
      </div>
    </article>
  `;
}

async function openMdModal(mdPath, item, triggerEl) {
  lastFocused = triggerEl || document.activeElement;
  els.mdModal.hidden = false;
  els.modalTitle.textContent = `Alien Dossier • ${item.name}`;
  els.modalBody.innerHTML = '<div class="dossier-loading">Loading dossier…</div>';
  document.body.style.overflow = 'hidden';

  try {
    const res = await fetch(mdPath, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.text();
    els.modalBody.innerHTML = mdToDossierHtml(raw, item);
  } catch (err) {
    els.modalBody.innerHTML = `<div class="dossier-error">Could not load <code>${esc(mdPath)}</code>. ${esc(err.message || String(err))}</div>`;
  }

  els.modalClose.focus();
}

function closeMdModal() {
  if (els.mdModal.hidden) return;
  els.mdModal.hidden = true;
  document.body.style.overflow = '';
  els.modalBody.innerHTML = '';
  if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
}

function render() {
  const size = Number(els.pageSize.value) || 36;
  const totalPages = Math.max(1, Math.ceil(filtered.length / size));
  if (page > totalPages) page = totalPages;
  const start = (page - 1) * size;
  const rows = filtered.slice(start, start + size);

  els.grid.innerHTML = rows.length ? rows.map(item => `
    <article class="card">
      ${item.png ? `<a href="${item.png}" target="_blank" rel="noopener"><img class="thumb" loading="lazy" src="${item.png}" alt="${esc(item.name)}" /></a>` : '<div class="thumb"></div>'}
      <div class="card-body">
        <p class="name">${esc(item.name)}</p>
        <div class="chips">
          <button class="chip md-open" data-md="${item.md}" data-name="${esc(item.name)}">I am</button>
        </div>
      </div>
    </article>
  `).join('') : '<div class="empty">No matches.</div>';

  els.stats.textContent = `${filtered.length} aliens`;
  els.pnum.textContent = `Page ${page} / ${totalPages}`;
  els.prev.disabled = page <= 1;
  els.next.disabled = page >= totalPages;
}

function applyFilter() {
  const q = els.q.value.trim().toLowerCase();
  filtered = q ? ITEMS.filter(i => i.name.toLowerCase().includes(q) || i.md.toLowerCase().includes(q)) : [...ITEMS];
  page = 1;
  render();
}

els.q.addEventListener('input', applyFilter);
els.pageSize.addEventListener('change', () => { page = 1; render(); });
els.prev.addEventListener('click', () => { page = Math.max(1, page - 1); render(); });
els.next.addEventListener('click', () => { page += 1; render(); });

els.grid.addEventListener('click', (e) => {
  const btn = e.target.closest('.md-open');
  if (!btn) return;
  const md = btn.getAttribute('data-md');
  const name = btn.getAttribute('data-name') || md;
  const item = ITEMS.find(i => i.md === md) || { md, name, png: null };
  openMdModal(md, item, btn);
});

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.doc-open');
  if (!btn) return;
  const md = btn.getAttribute('data-md');
  const name = btn.getAttribute('data-title') || md;
  openMdModal(md, { md, name, png: null }, btn);
});

els.mdModal.addEventListener('click', (e) => {
  if (e.target === els.mdModal || e.target.dataset.close === '1') closeMdModal();
});
els.modalClose.addEventListener('click', closeMdModal);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMdModal();
});

render();
</script>
