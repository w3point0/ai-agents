    .chip { background:var(--chip); border:1px solid var(--border); border-radius:999px; padding:4px 8px; font-size:.82rem; }
    .file a { color:var(--accent2); text-decoration:none; font-size:.86rem; }
    .file a:hover { text-decoration:underline; }
    .pager { display:flex; gap:10px; justify-content:center; align-items:center; margin:18px 0 4px; }
    button { background:#1d2d63; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:8px 12px; cursor:pointer; }

style"]}];
    const PAGE_SIZE = 12;
    let page = 1;
    let filtered = [...DATA];
    const grid = document.getElementById('grid');
    const pageInfo = document.getElementById('pageInfo');
    const meta = document.getElementById('meta');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const search = document.getElementById('search');
    const category = document.getElementById('category');

    function card(item) {
      return `<article class="card">
        <div class="head"><div class="name">${item.emoji} ${item.name}</div><span class="badge">${item.category}</span></div>
        <div class="arch">${item.archetype}</div>
        <div class="vibe">${item.vibe}</div>
        <div class="ttl">Traits</div><div class="chips">${item.traits.map(t => `<span class='chip'>${t}</span>`).join('')}</div>
        <div class="ttl">Special Characteristics</div><div class="chips">${item.special.map(s => `<span class='chip'>${s}</span>`).join('')}</div>
        <div class="ttl">Source</div><div class="file"><a href="${item.file}">${item.file}</a></div>
      </article>`;
    }

    function applyFilter() {
      const q = search.value.trim().toLowerCase();
      const c = category.value;
      filtered = DATA.filter(d => {
        const inCat = c === 'all' || d.category === c;
        if (!inCat) return false;
        if (!q) return true;
        return d.name.toLowerCase().includes(q) || d.archetype.toLowerCase().includes(q) || d.vibe.toLowerCase().includes(q) || d.traits.join(' ').toLowerCase().includes(q) || d.special.join(' ').toLowerCase().includes(q);
      });
      page = 1; render();
    }

    function render() {
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      page = Math.min(page, totalPages);
      const start = (page - 1) * PAGE_SIZE;
      const items = filtered.slice(start, start + PAGE_SIZE);
      grid.innerHTML = items.map(card).join('');
      pageInfo.textContent = `Page ${page} / ${totalPages}`;
      meta.textContent = `Showing ${items.length} of ${filtered.length} souls (${DATA.length} total)`;
      prev.disabled = page <= 1;
      next.disabled = page >= totalPages;
    }

    prev.addEventListener('click', () => { page--; render(); });
    next.addEventListener('click', () => { page++; render(); });
    search.addEventListener('input', applyFilter);
    category.addEventListener('change', applyFilter);
    render();
  </script>
