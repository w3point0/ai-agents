    :root {
      --bg: #0b1020;
      --panel: #111937;
      --panel-2: #0f1732;
      --text: #e7ecff;
      --muted: #aab6e8;
      --accent: #6ee7ff;
      --accent-2: #9b8cff;
      --chip: #1b2858;
      --border: #2b3a7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1c2b63 0%, var(--bg) 55%);
      color: var(--text);
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .sub { color: var(--muted); margin-bottom: 20px; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 260px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
    }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .name { font-size: 1.1rem; font-weight: 700; }
    .arch { color: var(--accent); font-weight: 600; margin: 6px 0 2px; }
    .vibe { color: var(--muted); font-size: .95rem; margin-bottom: 8px; }
    .section-title { font-size: .8rem; color: #b9c5f7; text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 6px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background: var(--chip); border: 1px solid var(--border); padding: 4px 8px; border-radius: 999px; font-size: .82rem; }
    .file a { color: var(--accent-2); text-decoration: none; font-size: .85rem; }
    .file a:hover { text-decoration: underline; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 20px 0 4px; }
    button {
      background: #1d2c62; color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .meta { text-align: center; color: var(--muted); font-size: .92rem; }
  </style>
</head>

.md", "archetype": "Mars Ops Commander", "vibe": "decisive, mission-driven, resilient", "emoji": "🚀", "traits": ["bias for practical execution", "curiosity without chaos", "clear trade-off framing"], "special": ["Sci-fi modern persona", "SOUL.md-aligned boundaries", "Outcome-first operating rhythm"]}, {"name": "Zinnia", "file": "sci-fi-traits/SOUL-Zinnia.md", "archetype": "Holo Storysmith", "vibe": "imaginative, warm, expressive", "emoji": "🎞️", "traits": ["quiet confidence", "quiet confidence", "protective of user time and focus"], "special": ["Sci-fi modern persona", "SOUL.md-aligned boundaries", "Outcome-first operating rhythm"]}];
    const PAGE_SIZE = 12;
    let page = 1;
    let filtered = [...DATA];

    const grid = document.getElementById('grid');
    const pageInfo = document.getElementById('pageInfo');
    const meta = document.getElementById('meta');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const search = document.getElementById('search');

    function card(item) {
      return `
        <article class="card">
          <div class="head">
            <div class="name">${item.emoji} ${item.name}</div>
          </div>
          <div class="arch">${item.archetype}</div>
          <div class="vibe">${item.vibe}</div>

          <div class="section-title">Traits</div>
          <div class="chips">${item.traits.map(t => `<span class="chip">${t}</span>`).join('')}</div>

          <div class="section-title">Special</div>
          <div class="chips">${item.special.map(s => `<span class="chip">${s}</span>`).join('')}</div>

          <div class="section-title">Source</div>
          <div class="file"><a href="${item.file}">${item.file}</a></div>
        </article>
      `;
    }

    function render() {
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      page = Math.min(page, totalPages);
      const start = (page - 1) * PAGE_SIZE;
      const items = filtered.slice(start, start + PAGE_SIZE);

      grid.innerHTML = items.map(card).join('');
      pageInfo.textContent = `Page ${page} / ${totalPages}`;
      meta.textContent = `Showing ${items.length} of ${filtered.length} agents`;
      prev.disabled = page <= 1;
      next.disabled = page >= totalPages;
    }

    function applyFilter(q) {
      const s = q.trim().toLowerCase();
      if (!s) { filtered = [...DATA]; page = 1; render(); return; }
      filtered = DATA.filter(d =>
        d.name.toLowerCase().includes(s) ||
        d.archetype.toLowerCase().includes(s) ||
        d.vibe.toLowerCase().includes(s) ||
        d.traits.join(' ').toLowerCase().includes(s) ||
        d.special.join(' ').toLowerCase().includes(s)
      );
      page = 1;
      render();
    }

    prev.addEventListener('click', () => { page--; render(); });
    next.addEventListener('click', () => { page++; render(); });
    search.addEventListener('input', e => applyFilter(e.target.value));

    render();
  </script>
