f framing"],"specials":[],"source":"sci-fi-traits/SOUL-Zev.md"},{"name":"Zinnia","category":"Sci Fi Traits","archetype":"Holo Storysmith","vibe":"","traits":["quiet confidence","quiet confidence","protective of user time and focus"],"specials":[],"source":"sci-fi-traits/SOUL-Zinnia.md"}];
const PER_PAGE = 12;
let page = 1;
const q = document.getElementById('search');
const c = document.getElementById('category');
const grid = document.getElementById('grid');
const meta = document.getElementById('meta');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const pageInfo = document.getElementById('pageInfo');

for (const cat of [...new Set(ALL.map(x => x.category))].sort()) {
  const opt = document.createElement('option');
  opt.value = cat; opt.textContent = cat; c.appendChild(opt);
}

function matches(item, term, cat) {
  const inCat = cat === 'all' || item.category === cat;
  if (!inCat) return false;
  if (!term) return true;
  const blob = [item.name,item.category,item.archetype,item.vibe,...(item.traits||[]),...(item.specials||[])].join(' ').toLowerCase();
  return blob.includes(term);
}

function render() {
  const term = q.value.trim().toLowerCase();
  const cat = c.value;
  const filtered = ALL.filter(x => matches(x, term, cat));
  const pages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (page > pages) page = pages;
  const start = (page - 1) * PER_PAGE;
  const slice = filtered.slice(start, start + PER_PAGE);

  grid.innerHTML = '';
  for (const s of slice) {
    const emoji = CATEGORY_EMOJI[s.category] || '✨';
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="head"><div class="name">${emoji} ${s.name}</div><div class="badge">${s.category}</div></div>
      <div class="arch">${s.archetype || ''}</div>
      <div class="vibe">${s.vibe || ''}</div>
      <div class="ttl">Traits</div>
      <div class="chips">${(s.traits || []).map(t => `<span class="chip">${t}</span>`).join('')}</div>
      <div class="ttl">Special Characteristics</div>
      <div class="chips">${(s.specials || []).map(t => `<span class="chip">${t}</span>`).join('')}</div>
      <div class="ttl">Source</div>
      <div class="file"><a href="${s.source}">${s.source}</a></div>`;
    grid.appendChild(card);
  }

  prev.disabled = page <= 1;
  next.disabled = page >= pages;
  pageInfo.textContent = `Page ${page} / ${pages}`;
  meta.textContent = `Showing ${slice.length} of ${filtered.length} souls (${ALL.length} total)`;
}

q.addEventListener('input', () => { page = 1; render(); });
c.addEventListener('change', () => { page = 1; render(); });
prev.addEventListener('click', () => { if (page > 1) { page--; render(); } });
next.addEventListener('click', () => { page++; render(); });
render();
</script></body></html>
